specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Karrio
providerId: karrio
generated: '2026-08-27'
method: searched
source: https://karrio.io/platform
created: '2026-05-04'
modified: '2026-08-27'
tags:
  - Shipping
  - Logistics
  - Open Source
  - Pricing
description: >-
  Karrio's published commercial model, read from the FAQ section of
  https://karrio.io/platform on 2026-08-27. Karrio does not publish a pricing page or a
  pricing table; the only prices it states anywhere are three sentences in that FAQ.
  There is no self-serve checkout and no published quota, overage or rate limit attached
  to any tier — the price points below are entry prices, not plan definitions.
plan_count: 3
pricing_page_published: false
self_serve_checkout: false
note: >-
  https://karrio.io/pricing and https://karrio.io/get-started both return HTTP 404. The
  site's "Get Started" call to action links to /platform, and the managed platform is
  reached by "Book a demo". The hosted dashboard at app.karrio.io returns HTTP 503
  DEPLOYMENT_PAUSED, so the self-serve path a reader would expect behind these prices
  could not be exercised.
plans:
  - id: karrio-open-source
    name: Karrio Open Source
    type: free
    price: '0.00'
    currency: USD
    billingPeriod: none
    quoted: >-
      "Karrio is free to use if you self-host our open-source version."
    description: >-
      Self-hosted Apache-2.0 platform. The full REST API, GraphQL management API,
      dashboard and every carrier extension. No usage metering by Karrio, because Karrio
      is not in the request path — the operator runs the instance.
    limits:
      metered_by_karrio: false
      note: Limits are whatever the operator's own infrastructure and carrier accounts impose.
    elements:
      - name: Full REST API (95 operations)
      - name: GraphQL management API
      - name: Dashboard
      - name: 30+ carrier extensions
      - name: Community support via GitHub Discussions and Discord
  - id: karrio-scale
    name: Karrio Platform (Scale)
    type: paid
    price: '499.00'
    currency: USD
    billingPeriod: month
    priceQualifier: starts at
    quoted: >-
      "Our managed Scale platform starts at $499/month with pay-as-you-go pricing."
    description: >-
      Karrio-managed hosting of the platform. Pay-as-you-go usage on top of the monthly
      floor; neither the included volume nor the per-unit overage rate is published.
    limits:
      included_quota: unpublished
      overage: 'pay-as-you-go — rate not published'
    elements:
      - name: Managed hosting
      - name: Email support
      - name: Slack support
  - id: karrio-commercial-license
    name: Commercial / Embedded License
    type: enterprise
    price: '50000.00'
    currency: USD
    billingPeriod: year
    priceQualifier: starts at
    quoted: >-
      "Our commercial license allows you to white-label Karrio and embed it directly into
      your platform. This includes custom branding, domain support, and unlimited usage
      starting at $50,000/year."
    description: >-
      White-label and embed Karrio inside your own product. The only tier for which
      Karrio states an explicit volume position, and it states it as unlimited.
    limits:
      included_quota: unlimited
      overage: none
    elements:
      - name: White-label branding
      - name: Custom domain support
      - name: Unlimited usage
      - name: Dedicated account management
      - name: Priority support with SLA
      - name: One-on-one developer calls
carrier_accounts:
  byo_required: true
  quoted: >-
    "Yes. Karrio is a universal API that plugs into your existing carrier accounts. This
    puts you in control of your rates and relationships."
  note: >-
    Karrio does not resell postage. Shipping spend is billed by the carrier directly, so
    none of the prices above include label cost.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
