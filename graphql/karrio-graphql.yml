description: >-
  Karrio's management API is GraphQL. It sits alongside the REST shipping API on the same
  instance at POST /graphql and covers organizations, users, API keys, carrier
  connections, rate sheets, events, webhook delivery, API logs and carrier tracing —
  most of which has no REST equivalent. The live endpoint requires an authenticated
  instance, so no introspection was run against a server; these are the schemas Karrio
  itself publishes in its repository.
