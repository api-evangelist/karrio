openapi: 3.2.0
info:
  description: Karrio is a multi-carrier shipping API that simplifies the integration of logistics carrier services.
  title: Karrio Parcels API
  version: 2026.1.32
tags:
- name: Parcels
  description: 'This is an object representing your Karrio shipping parcel.

    Parcel objects are linked to your shipment history, and can be used for recurring shipping

    using the same packaging.'
paths:
  /v1/parcels:
    get:
      operationId: $$$list
      description: 'Retrieve all stored parcels.


        Query Parameters:

        - label: Filter by meta.label (case-insensitive contains)

        - keyword: Search by label

        - usage: Filter by meta.usage (exact match in array)'
      summary: List all parcels
      tags:
      - Parcels
      security:
      - TokenBasic: []
      - Token: []
      - OAuth2: []
      - JWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelList'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
      x-operationId: listParcels
    post:
      operationId: $$$create
      description: Create a new parcel.
      summary: Create a parcel
      tags:
      - Parcels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParcelData'
        required: true
      security:
      - TokenBasic: []
      - Token: []
      - OAuth2: []
      - JWT: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcel'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
      x-operationId: createParcel
  /v1/parcels/{id}:
    get:
      operationId: $$$retrieve
      description: Retrieve a parcel.
      summary: Retrieve a parcel
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Parcels
      security:
      - TokenBasic: []
      - Token: []
      - OAuth2: []
      - JWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcel'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
      x-operationId: retrieveParcel
    patch:
      operationId: $$$update
      description: modify an existing parcel's details.
      summary: Update a parcel
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Parcels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedParcelData'
      security:
      - TokenBasic: []
      - Token: []
      - OAuth2: []
      - JWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcel'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
      x-operationId: updateParcel
    delete:
      operationId: $$$discard
      description: Remove a parcel.
      summary: Remove a parcel
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Parcels
      security:
      - TokenBasic: []
      - Token: []
      - OAuth2: []
      - JWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parcel'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
      x-operationId: discardParcel
components:
  schemas:
    Parcel:
      type: object
      properties:
        id:
          type: string
          description: A unique identifier
        weight:
