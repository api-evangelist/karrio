components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/APIError'
          description: The list of API errors
    CarrierDetails:
      type: object
      properties:
        carrier_name:
          enum:
          - aramex
          - asendia
          - asendia_us
          - australiapost
          - boxknight
          - bpost
          - canadapost
          - canpar
          - chronopost
          - colissimo
          - dhl_express
          - dhl_parcel_de
          - dhl_poland
          - dhl_universal
          - dicom
          - dpd
          - dpd_meta
          - dtdc
          - easypost
          - easyship
          - eshipper
          - fedex
          - freightcom
          - generic
          - geodis
          - gls
          - hay_post
          - hermes
          - landmark
          - laposte
          - locate2u
          - mydhl
          - nationex
          - parcelone
          - postat
          - purolator
          - roadie
          - royalmail
          - sapient
          - seko
          - sendle
          - shipengine
          - smartkargo
          - spring
          - teleship
          - tge
          - tnt
          - ups
          - usps
          - usps_international
          - veho
          - zoom2u
          type: string
          x-spec-enum-id: ae0f7f0940fb5243
          description: Indicates a carrier (type)
        display_name:
          type: string
          description: The carrier verbose name.
        integration_status:
          enum:
          - in-development
          - beta
          - production-ready
          type: string
          x-spec-enum-id: d58225b23f9a1710
          description: The carrier integration status.
        capabilities:
          type: array
          items:
            type: string
          default: []
          description: The carrier supported and enabled capabilities.
        connection_fields:
          type: object
          additionalProperties: {}
          default: {}
          description: The carrier connection fields.
        config_fields:
          type: object
          additionalProperties: {}
          default: {}
          description: The carrier connection config.
        shipping_services:
          type: object
          additionalProperties: {}
          default: {}
          description: The carrier shipping services.
        shipping_options:
          type: object
          additionalProperties: {}
          default: {}
          description: The carrier shipping options.
      required:
      - carrier_name
      - display_name
      - integration_status
    APIError:
      type: object
      properties:
        message:
          type: string
          description: The error or warning message
        code:
          type: string
          description: The message code
        level:
          type: string
          description: The message level
        details:
          type: object
          additionalProperties: {}
          description: any additional details
  securitySchemes:
    JWT:
      in: header
      type: apiKey
      scheme: bearer
      bearerFormat: JWT
      name: Authorization
      description: 'Authorization: Bearer xxx.xxx.xxx'
    OAuth2:
      type: oauth2
      in: header
      name: Authorization
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize/
          tokenUrl: /oauth/token/
          scopes:
            read: Read access to Karrio data
            write: Write access to Karrio data
            openid: OpenID connect
      description: 'Authorization: Bearer xxxxxxxx'
    Token:
      type: apiKey
      in: header
      name: Authorization
      description: 'Authorization: Token key_xxxxxxxx'
    TokenBasic:
      type: http
      scheme: basic
      name: Authorization
      description: '-u key_xxxxxxxx:'
