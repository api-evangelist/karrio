                          currency: EUR
                          dimension_unit: CM
                          domicile: true
                          max_height: 60
                          max_length: 120
                          max_weight: 31.5
                          max_width: 60
                          metadata: {}
                          min_weight: 0.01
                          service_code: dhl_parcel_de_paket
                          service_name: DHL Paket
                          weight_unit: KG
                          zones:
                          - rate: 0.0
                        - active: true
                          currency: EUR
                          dimension_unit: CM
                          domicile: false
                          international: true
                          max_height: 60
                          max_length: 120
                          max_weight: 31.5
                          max_width: 60
                          metadata: {}
                          min_weight: 0.01
                          service_code: dhl_parcel_de_paket_international
                          service_name: DHL Paket International
                          weight_unit: KG
                          zones:
                          - rate: 0.0
                        - active: true
                          currency: EUR
                          dimension_unit: CM
                          domicile: false
                          international: true
                          max_height: 60
                          max_length: 120
                          max_weight: 31.5
                          max_width: 60
                          metadata: {}
                          min_weight: 0.01
                          service_code: dhl_parcel_de_europaket
                          service_name: DHL EuroPaket
