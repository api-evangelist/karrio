        shipper:
          allOf:
          - $ref: '#/components/schemas/AddressData'
          description: "The address of the party.<br/>\n        Origin address (ship from) for the **shipper**<br/>\n        Destination address (ship to) for the **recipient**\n        "
        return_address:
          allOf:
          - $ref: '#/components/schemas/AddressData'
