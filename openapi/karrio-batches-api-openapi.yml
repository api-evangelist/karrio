        required: true
      security:
      - TokenBasic: []
      - Token: []
      - OAuth2: []
      - JWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchOperation'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /v1/batches/webhooks:
    post:
      operationId: $$$$$$$$resend_webhooks
      description: Resend webhook notifications for a batch of entities.
      summary: Resend webhooks
      tags:
      - Batches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchWebhookResendRequest'
        required: true
      security:
      - TokenBasic: []
      - Token: []
      - OAuth2: []
      - JWT: []
      responses:
        '200':
