openapi: 3.2.0
info:
  description: Karrio is a multi-carrier shipping API that simplifies the integration of logistics carrier services.
  title: Karrio Products API
  version: 2026.1.32
tags:
- name: Products
  description: 'This is an object representing your Karrio product template.

    Product templates are reusable commodity definitions that can be used in customs declarations

    and shipment items for recurring shipments of the same products.'
paths:
  /v1/products:
    get:
      operationId: $&list
      description: 'Retrieve all product templates.


        Products are reusable commodity definitions that can be used

        in customs declarations and shipment items.


        Query Parameters:

        - label: Filter by meta.label (case-insensitive contains)

        - keyword: Search across label, title, sku, description, hs_code

        - usage: Filter by meta.usage (exact match in array)'
      summary: List all products
      tags:
      - Products
      security:
      - TokenBasic: []
      - Token: []
      - OAuth2: []
      - JWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
      x-operationId: listProducts
    post:
      operationId: $&create
      description: 'Create a new product template.


        Products must include a `meta.label` to be identified as templates.'
      summary: Create a product
      tags:
      - Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommodityData'
        required: true
      security:
      - TokenBasic: []
      - Token: []
      - OAuth2: []
      - JWT: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commodity'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
      x-operationId: createProduct
  /v1/products/{id}:
    get:
      operationId: $&retrieve
      description: Retrieve a product template by ID.
      summary: Retrieve a product
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Products
      security:
      - TokenBasic: []
      - Token: []
      - OAuth2: []
      - JWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commodity'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
      x-operationId: retrieveProduct
    patch:
      operationId: $&update
      description: Update an existing product template.
      summary: Update a product
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCommodityData'
      security:
      - TokenBasic: []
      - Token: []
      - OAuth2: []
      - JWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commodity'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
      x-operationId: updateProduct
    delete:
      operationId: $&discard
      description: Delete a product template.
      summary: Remove a product
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Products
      security:
      - TokenBasic: []
      - Token: []
      - OAuth2: []
      - JWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commodity'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
      x-operationId: discardProduct
