description: >-
  First-party Karrio client libraries, server modules and carrier extensions. Karrio
  distributes the Python surface on PyPI under a single calendar version (2026.1.32) that
  tracks the platform release. The Node/TypeScript surface is materially weaker: the only
  published npm package is three and a half years stale, and every @karrio-scoped package
  the documentation instructs users to install returns 404 on the npm registry.
