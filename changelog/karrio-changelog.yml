entries:
- version: 2026.1.32
  date: '2026-06-23'
  breaking: false
  summary: >-
    Patch release resolving six operational and security issues reported by self-hosted
    operators, plus carrier fixes for FedEx and USPS.
  highlights:
  - Migration 0093 no longer cascades into tracking/shipment/pickup history (GH #1116).
  - MD5 PASSWORD_HASHERS override scoped to the test runner so production no longer stores MD5 hashes (GH #1094).
  - USPS server URLs updated to apis.usps.com / apis-tem.usps.com after USPS retired the legacy Web Tools hosts (GH #1118).
  - FedEx shipment customerReferences fully populated; fedex_pickup_type shipping option added (GH #1082, #1105).
  - Official USPS Developer Portal v3 OpenAPI specs vendored for the usps connectors.
- version: 2026.1.31
  date: '2026-04-29'
  breaking: false
  summary: >-
    Hotfix. Tracking lookups 500'd whenever any carrier event had a null description.
  highlights:
  - TrackingEvent.description made optional end-to-end across SDK, DRF serializer and GraphQL.
- version: 2026.1.30
  date: '2026-04-28'
  breaking: false
  summary: >-
    Hotfix. SmartKargo tracking returned 404 on .NET ticks-precision timestamps.
  highlights:
  - Event dates truncated to microsecond precision with a try_formats parse list.
- version: 2026.1.29
  date: '2026-04-19'
  breaking: false
  summary: >-
    Hotfix. Fixes the DuplicateColumn "archived_at" migration failure on 2026.1.28.
  highlights:
  - Archiving field migrations made idempotent; safe upgrade path from 2026.1.26+.
  - POST /v1/documents/generate responses no longer persisted in api_logs (table bloat).
