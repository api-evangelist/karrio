description: >-
  Karrio keeps a genuinely good changelog: every release carries a one-paragraph summary
  of WHY it shipped, then Fix / Feat / Chore sections with GitHub issue numbers. It is
  written for a self-hosted operator deciding whether to upgrade, which is the right
  audience for this product. The one weakness is dating — CHANGELOG.md carries no dates,
  so the dates below come from the Git tags.
