provider: Karrio
providerId: karrio
type: Webhooks
asyncapi_published: false
description: >-
  Karrio has a real event surface and manages it through the REST API — webhooks are
  first-class objects with full CRUD plus a test-fire operation. It publishes NO AsyncAPI
  document, so the event catalog has to be read out of an enum inside the OpenAPI. Doing
  that turns up a discrepancy worth knowing about before you build against the docs.
event_catalog:
  authoritative_source: 'Webhook.enabled_events enum in the OpenAPI (x-spec-enum-id 7310794d8b16bdaf)'
  naming: snake_case, no dots
  count: 20
  wildcard: all
  events:
  - shipment_purchased
  - shipment_cancelled
  - shipment_fulfilled
  - shipment_out_for_delivery
  - shipment_needs_attention
  - shipment_delivery_failed
  - tracker_created
  - tracker_updated
  - pickup_scheduled
  - pickup_cancelled
  - pickup_closed
  - order_created
  - order_updated
  - order_fulfilled
  - order_cancelled
  - order_delivered
  - batch_queued
  - batch_failed
  - batch_running
  - batch_completed
documentation_discrepancy:
  severity: high
  detail: >-
    https://karrio.io/docs/products/webhooks shows a create-webhook payload subscribing to
    "shipment.created", "shipment.purchased", "tracking.status_updated",
    "tracking.delivered" and "order.fulfilled". Only ONE of those five ("order.fulfilled"
    -> order_fulfilled) has a counterpart in the contract's enum, and even that one is
    spelled differently. The contract uses snake_case with no dots; there is no
    shipment_created, no tracking_* namespace and no tracking_delivered event at all
    (delivery is tracker_updated, or shipment_out_for_delivery /
    shipment_delivery_failed). An integrator who copies the documented payload will be
    rejected by the enum.
  affected_page: https://karrio.io/docs/products/webhooks
  contract_wins: true
management:
  api: rest
  operations:
  - operationId: '$$$$$$$list'
