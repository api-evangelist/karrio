    test_mode: boolean
delivery:
  retries: true
  strategy: exponential backoff
  dead_letter: true
  replay: POST /v1/batches/webhooks (resend_webhooks)
  signature_verification: true
  signature_mechanism: >-
    Shared secret stored on the webhook object and used to sign a request header. Karrio
    does not publish the header name or the signature algorithm on any page found, which
    is a gap — a consumer cannot implement verification from the published docs alone.
  monitoring: >-
    Delivery counts and last response status are exposed on the webhook object; full
    delivery history is in the GraphQL events/api_logs surface.
event_object:
  source: GraphQL Event type (management API)
  fields:
