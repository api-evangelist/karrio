apis:
- aid: karrio:shipping-api
  name: Karrio Shipping API
  description: >-
    Karrio's unified multi-carrier shipping REST API. Ninety-five operations across
    addresses, parcels, products, shipments, rating, label purchase, trackers, pickups,
    manifests, customs documents, orders, batches, carrier connections, proxy passthrough
    and webhooks. Karrio is deployed per instance — self-hosted or managed — so the base
    URL is the URL of your own Karrio instance rather than a single shared host.
  humanURL: https://karrio.io/docs/api-reference
  baseURL: https://{karrio-instance-host}/
