aid: karrio
name: Karrio
description: >-
  Karrio is an open-source, headless multi-carrier shipping platform for developers and
  logistics teams. Its unified REST API and GraphQL management API abstract more than
  thirty carrier integrations behind one resource-oriented interface covering live rating,
  label generation and purchase, package tracking, pickups, manifests, orders, customs
  documents and webhooks. Karrio can be self-hosted from the Apache-2.0 source, run as the
  managed Karrio Platform, or embedded and white-labelled under a commercial license.
